astrolift_version = 1
name = "conflict-quake-dash"

[app]
slug = "conflict-quake-dash"
display_name = "Seismic Activity"

[environments.production]

[[workloads]]
name = "web"
kind = "deployment"
replicas = 1
is_public = true
cpu_request = "100m"
cpu_limit = "500m"
memory_request = "192Mi"
memory_limit = "384Mi"

[[workloads.containers]]
name = "web"
is_primary = true
port = 8080

[workloads.containers.healthcheck]
kind = "http"
value = "/health"
port = 8080

[workloads.containers.env]
PYTHONUNBUFFERED = "1"
DATASET_REFRESH_SECONDS = "900"

[[workloads]]
name = "refresh"
kind = "cronjob"
schedule = "0 */4 * * *"
cpu_request = "100m"
cpu_limit = "500m"
memory_request = "192Mi"
memory_limit = "384Mi"

[[workloads.containers]]
name = "refresh"
is_primary = true
command = [
    "python",
    "refresh.py",
]

[workloads.containers.env]
PYTHONUNBUFFERED = "1"

[[managed_services]]
kind = "object_store"
name = "quake-data"
variant = "s3"
bind_workloads = [
    "*",
]

[ingress]
class = "alb"

[ingress.auth]
kind = "cognito"
user_pool_arn = "arn:aws:cognito-idp:us-west-2:790347818717:userpool/us-west-2_xU96Y7DAg"
user_pool_client_id = "1e3f2egf7ibju4c9rnldk98cvv"
user_pool_domain = "conflict"
